{{define "error.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/dashboard/static/dashboard.css">
</head>
<body>
  <div class="shell">
    {{if .Username}}
    <header class="topbar">
      <a class="brand" href="/dashboard">Alexander <span>Storage</span></a>
      <nav class="nav">
        <a href="/dashboard">Buckets</a>
        <a href="/dashboard/users">Users</a>
      </nav>
      <div class="user-meta"><strong>{{.Username}}</strong></div>
    </header>
    {{end}}
    <main class="main">
      <h1>Something went wrong</h1>
      <p class="lede">{{if .Error}}{{.Error}}{{else}}Unexpected error{{end}}</p>
      <a class="btn btn-primary" href="/dashboard">Back to dashboard</a>
    </main>
  </div>
</body>
</html>
{{end}}
